name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The real google-services.json is not in the repository. The Google
      # Services plugin only needs a file with the right package name to build.
      - name: Placeholder Firebase config
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mbois-ci",
              "storage_bucket": "mbois-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.kuartet.mbois" }
                },
                "oauth_client": [
                  { "client_id": "000000000000-ci.apps.googleusercontent.com", "client_type": 3 }
                ],
                "api_key": [{ "current_key": "ci-placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - run: ./gradlew testDebugUnitTest
